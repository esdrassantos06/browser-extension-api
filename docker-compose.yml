services:
  nest-api:
    build: .
    container_name: nest-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - nest-postgres
    env_file:
      - .env

  nest-postgres:
    image: postgres:latest
    container_name: nest-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    env_file:
      - .env
    volumes:
      - nest-postgres:/var/lib/postgresql/data

volumes:
  nest-postgres:
    name: nest-postgres-db
